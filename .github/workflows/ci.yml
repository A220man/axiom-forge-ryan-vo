name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=. .venv/bin/pytest -v --tb=short

      - name: Run type checking
        run: |
          .venv/bin/mypy app --ignore-missing-imports

      - name: Run linting
        run: |
          .venv/bin/ruff check app tests

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run build 2>&1 | head -50

      - name: Run tests
        run: npm test -- --run

      - name: Run linting
        run: npm run lint

  docker-build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: axiom-forge-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: axiom-forge-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build-backend, docker-build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d backend
          sleep 10
          # Wait for backend health
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "Backend healthy"
              break
            fi
            sleep 2
          done

      - name: Run integration tests
        run: |
          # Test health endpoint
          curl -sf http://127.0.0.1:8000/healthz | jq -e '.status == "ok"'

          # Test fixture CRUD
          FIXTURE=$(curl -s -X POST http://127.0.0.1:8000/api/v1/fixtures \
            -H "Content-Type: application/json" \
            -d '{"name":"Test Fixture","content":{"metadata":{"name":"test"},"tests":[]}}')
          FIXTURE_ID=$(echo $FIXTURE | jq -r .id)
          echo "Created fixture: $FIXTURE_ID"

          # Test provider CRUD
          PROVIDER=$(curl -s -X POST http://127.0.0.1:8000/api/v1/providers \
            -H "Content-Type: application/json" \
            -d '{"name":"Mock Provider","provider_type":"mock","model":"test-model"}')
          PROVIDER_ID=$(echo $PROVIDER | jq -r .id)
          echo "Created provider: $PROVIDER_ID"

          # Test audit run creation
          RUN=$(curl -s -X POST http://127.0.0.1:8000/api/v1/audit-runs \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Integration Test\",\"fixture_id\":\"$FIXTURE_ID\",\"provider_config_id\":\"$PROVIDER_ID\",\"suite\":\"smoke\"}")
          RUN_ID=$(echo $RUN | jq -r .id)
          echo "Created audit run: $RUN_ID"

          # Execute audit run
          curl -s -X POST "http://127.0.0.1:8000/api/v1/audit-runs/$RUN_ID/execute" | jq -e '.status == "running"'

          # Wait for completion
          for i in {1..30}; do
            STATUS=$(curl -s "http://127.0.0.1:8000/api/v1/audit-runs/$RUN_ID" | jq -r .status)
            if [ "$STATUS" = "completed" ]; then
              echo "Audit run completed"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "Audit run failed"
              exit 1
            fi
            sleep 1
          done

          # Get results
          RESULTS=$(curl -s "http://127.0.0.1:8000/api/v1/audit-runs/$RUN_ID/results")
          echo $RESULTS | jq -e '.grade'
          echo $RESULTS | jq -e '.overall_score >= 0 and .overall_score <= 1'
          echo "Integration test passed!"

      - name: Cleanup
        if: always()
        run: docker compose down -v