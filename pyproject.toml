[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-forge-ryan-vo"
version = "1.0.0"
description = "Independent auditing platform for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"},
]
keywords = ["ai", "governance", "safety", "compliance", "auditing", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "httpx-mock>=0.10.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[project.scripts]
axiom-forge = "app.main:create_app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: end-to-end tests that run against the mock provider",
    "unit: fast in-process tests with no external dependencies",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "TRY", "BLE"]
ignore = [
    "TRY003",
    "RUF001",
    "RUF002",
    "RUF003",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/providers/base.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true