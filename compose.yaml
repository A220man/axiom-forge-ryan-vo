version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: axiom-forge-backend
    environment:
      - APP_NAME=axiom-forge-ryan-vo
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/audit.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production-min-32-chars}
      - CSRF_SECRET=${CSRF_SECRET:-dev-csrf-secret-change-in-production-min-32-chars}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_LOGOUT_REDIRECT_URI=${OIDC_LOGOUT_REDIRECT_URI:-}
      - DEMO_MODE=${DEMO_MODE:-true}
      - CORS_ORIGINS=["http://127.0.0.1:5173","http://localhost:5173"]
      - DEFAULT_SUITE=essential
      - AUDIT_TIMEOUT_SECONDS=120
    volumes:
      - backend-data:/app/backend/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/healthz', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - axiom-forge-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: axiom-forge-frontend
    environment:
      - VITE_API_URL=http://127.0.0.1:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - axiom-forge-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: axiom-forge-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=dev-file
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - axiom-forge-network

volumes:
  backend-data:
  keycloak-data:

networks:
  axiom-forge-network:
    driver: bridge